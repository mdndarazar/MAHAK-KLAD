name: Build Windows installer

on:
  push:
    branches:
      - arena/074a2e5d-newmahak
      - arena/8a852de1-mahak-klad
      - arena/7bfe7000-mahak-klad
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish the freshly validated installer as a public GitHub release
        required: false
        default: false
        type: boolean
      release_tag:
        description: Immutable release tag to create when publishing
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  package-windows:
    name: Package MahakPOS for Windows
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        shell: pwsh
        env:
          DATABASE_URL: file:./ci-validation.db
        run: |
          npx prisma validate *>&1 | Tee-Object -FilePath prisma-validation.log
          $validateExit = $LASTEXITCODE
          if ($validateExit -ne 0) {
            $detail = (Get-Content prisma-validation.log -Tail 20) -join ' | '
            if ($detail.Length -gt 3500) { $detail = $detail.Substring($detail.Length - 3500) }
            Write-Output "::error title=Prisma validate failed::$detail"
            exit $validateExit
          }

      - name: Generate Prisma Client
        env:
          DATABASE_URL: file:./ci-validation.db
        run: npm run db:generate

      - name: Apply Prisma migrations to a clean temporary SQLite database
        shell: pwsh
        run: |
          $env:DATABASE_URL = 'file:./ci-validation.db'
          try {
            npx prisma migrate deploy
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Remove-Item -Force prisma/ci-validation.db* -ErrorAction SilentlyContinue
          }

      - name: Typecheck application
        run: npm run typecheck

      - name: Verify source syntax
        run: npm run check:syntax

      - name: Run financial audit regression tests
        shell: pwsh
        run: |
          $tests = @(
            'tests/audit-fixes/fix-s60-exchange-debt.mjs',
            'tests/audit-fixes/fix-s64-return-void.mjs',
            'tests/audit-fixes/deep-e2e-scenario5-e100-034-invoice-discount.mjs',
            'tests/audit-fixes/fix-r1-b04-category-ancestry.mjs',
            'tests/audit-fixes/fix-r1-b05-b06-exchange-report.mjs',
            'tests/audit-fixes/fix-r1-b07-return-code-expiry.mjs',
            'tests/audit-fixes/fix-r2-b02-credit-lineage.mjs',
            'tests/audit-fixes/fix-financial-global-credit-return-policy.mjs',
            'tests/audit-fixes/fix-financial-global-credit-return-integration.mjs',
            'tests/audit-fixes/fix-financial-scenario4-multiuse-return-exchange-stock.mjs',
            'tests/audit-fixes/fix-exchange-child-restricted-credit-pooling.mjs',
            'tests/audit-fixes/fix-s340-returns-tabs-characterization.mjs',
            'tests/audit-fixes/deep-e2e-refund-decision-state-machine.mjs',
            'tests/audit-fixes/deep-e2e-followup-scenario13-no-method-auto-credit-and-independent-limit-gates.mjs'
          )
          foreach ($test in $tests) {
            Write-Host "Running $test"
            node --import ./test/harness/register.mjs $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build Windows installer
        shell: pwsh
        env:
          DATABASE_URL: file:./ci-validation.db
        run: |
          npm run dist:win -- --publish never *>&1 | Tee-Object -FilePath build-output.log
          if ($LASTEXITCODE -ne 0) {
            $lastLines = (Get-Content build-output.log -Tail 20) -join " | "
            Write-Output "::error title=Installer build failed::$lastLines"
            exit $LASTEXITCODE
          }

      - name: Create installable and source ZIPs
        if: success()
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          Compress-Archive -Path $installer.FullName -DestinationPath "dist/MahakPOS-$env:GITHUB_SHA-win-x64-installer.zip" -Force
          git archive --format=zip --prefix=MahakPOS/ $env:GITHUB_SHA --output "dist/MahakPOS-$env:GITHUB_SHA-source.zip"
          $releaseFiles = Get-ChildItem -Path dist -File | Where-Object { $_.Name -match '\.exe$|-installer\.zip$|-source\.zip$' }
          $lines = $releaseFiles | ForEach-Object { "$( (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower() )  $($_.Name)" }
          Set-Content -Path 'dist/SHA256SUMS.txt' -Value $lines -NoNewline

      - name: Publish public GitHub release
        # Ordinary development pushes only build and upload an artifact. A public
        # release needs an explicit dispatch; the narrowly-scoped push marker is
        # retained as the fallback for integration tokens that cannot dispatch.
        if: "${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.release_tag != '') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: publish Windows installer'))) }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'v0.1.0-financial-controls-20261012-final' }}
        run: |
          gh release create "$env:RELEASE_TAG" dist/*.exe dist/*-installer.zip dist/*-source.zip dist/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "MahakPOS $env:RELEASE_TAG" --notes "Windows x64 installer and CMD-ready source package built and validated by GitHub Actions from commit $env:GITHUB_SHA."

      - name: Upload Windows installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MahakPOS-Windows-installer
          path: |
            dist/*.exe
            dist/*-installer.zip
            dist/*-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MahakPOS-Windows-build-log
          path: |
            prisma-validation.log
            build-output.log
          if-no-files-found: warn
          retention-days: 30
