name: Remote hub Windows Node 24 compatibility

on:
  push:
    branches:
      - arena/e478473a-mahak-klad
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-node24:
    name: Windows Node 24 compatibility (experimental)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out current commit
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test disabled cloud service has no side effects
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-cloud-disabled.mjs
      - name: Test remote IPC window ownership and cleanup
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-ipc-window-lifecycle.mjs
      - name: Test remote IPC cannot extend idle grants
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-ipc-idle-no-keepalive.mjs
      - name: Test renderer session monitoring
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-renderer-session-monitor.mjs
      - name: Test remote IPC and child approval window lifecycle
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-ipc-hub-window-loopback.mjs
      - name: Test remote IPC claim and panic on loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-ipc-claim-panic-loopback.mjs
      - name: Test desktop host with provisioned temporary hub
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-desktop-host-loopback.mjs
      - name: Test desktop host member revocation and acknowledgement
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'remote-desktop-member-revocation.log'
          cmd /c "node --import ./test/harness/register.mjs tests/audit-fixes/remote-desktop-host-member-revocation.mjs > `"$log`" 2>&1"
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($code -ne 0) {
            $text = Get-Content -LiteralPath $log -Raw
            if ($text.Length -gt 12000) { $text = $text.Substring($text.Length - 12000) }
            $text = $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Desktop host member revocation test::$text"
            exit $code
          }
      - name: Test desktop host panic recovery
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-desktop-host-panic-recovery.mjs
      - name: Test uncertain desktop host startup shutdown
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-host-failed-start-stop.mjs
      - name: Test desktop reports unconfirmed child shutdown
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-host-unconfirmed-shutdown.mjs
      - name: Test database replacement during IPC claim on loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-ipc-claim-db-fence-loopback.mjs
      - name: Test audit sync failure closes remote grants
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-audit-sync-invalidates-grants.mjs
      - name: Test audit uncertainty fences old epoch
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-sync-uncertainty-epoch-fence.mjs
      - name: Test snapshot detects database replacement and fences epoch
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-refresh-db-epoch-fence.mjs
      - name: Test approval query timeout revokes before drain
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-approval-timeout-revokes-loopback.mjs
      - name: Test sync query timeout revokes before drain
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-sync-timeout-revokes-loopback.mjs
      - name: Test snapshot query timeout revokes before drain
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-refresh-timeout-revokes-loopback.mjs
      - name: Test same-inode audit anchor before request mirror
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-request-mirror-audit-fence-loopback.mjs
      - name: Test same-inode audit anchor change before approval and claim
        run: |
          node --import ./test/harness/register.mjs tests/audit-fixes/remote-ipc-approval-audit-anchor.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --import ./test/harness/register.mjs tests/audit-fixes/remote-ipc-claim-audit-anchor.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test user setting and experimental panic latch
        shell: pwsh
        run: |
          node --import ./test/harness/register.mjs tests/audit-fixes/remote-user-setting.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --import ./test/harness/register.mjs tests/audit-fixes/remote-panic-identity.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test conservative revocation clock handling
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-revocation-clock-conservative.mjs
      - name: Test experimental two-process loopback revocation
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'remote-network-revocation.log'
          cmd /c "node --import ./test/harness/register.mjs tests/audit-fixes/remote-network-revocation.mjs > `"$log`" 2>&1"
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($code -ne 0) {
            $text = Get-Content -LiteralPath $log -Raw
            if ($text.Length -gt 12000) { $text = $text.Substring($text.Length - 12000) }
            $text = $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Remote two-process revocation test::$text"
            exit $code
          }
      - name: Test experimental forged revocation ACK
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-network-ack.mjs
      - name: Test isolated hub on temporary SQLite
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-windows-node24.mjs
      - name: Test remote-supervisor-revocation-loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-supervisor-revocation-loopback.mjs
      - name: Test remote-revocation-failure-admission-loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-revocation-failure-admission-loopback.mjs
      - name: Test remote-revocation-transport-failure-loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-revocation-transport-failure-loopback.mjs
      - name: Test remote-revocation-cleanup-failure
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-revocation-cleanup-failure.mjs
      - name: Test remote-durable-revocation-ledger
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-durable-revocation-ledger.mjs
      - name: Test remote-supervisor-durable-revocation
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'remote-durable-revocation-test.log'
          cmd /c "node --import ./test/harness/register.mjs tests/audit-fixes/remote-supervisor-durable-revocation.mjs > `"$log`" 2>&1"
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($code -ne 0) {
            $text = Get-Content -LiteralPath $log -Raw
            if ($text.Length -gt 12000) { $text = $text.Substring($text.Length - 12000) }
            $text = $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Remote durable revocation test::$text"
            exit $code
          }
      - name: Test remote-supervisor-panic-loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-supervisor-panic-loopback.mjs
      - name: Test remote-supervisor-panic-failure-loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-supervisor-panic-failure-loopback.mjs
      - name: Test remote-supervisor-stop-cleanup-loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-supervisor-stop-cleanup-loopback.mjs
      - name: Test remote-supervisor-admission-lifecycle-loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-supervisor-admission-lifecycle-loopback.mjs
      - name: Test remote-panic-source-rate-loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-panic-source-rate-loopback.mjs
      - name: Test remote-expiry-panic-failure-loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-expiry-panic-failure-loopback.mjs
      - name: Test remote-panic-panel-session-loopback
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'remote-panel-test.log'
          cmd /c "node --import ./test/harness/register.mjs tests/audit-fixes/remote-panic-panel-session-loopback.mjs > `"$log`" 2>&1"
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($code -ne 0) {
            $text = Get-Content -LiteralPath $log -Raw
            if ($text.Length -gt 12000) { $text = $text.Substring($text.Length - 12000) }
            $text = $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Remote panel session test::$text"
            exit $code
          }
      - name: Test remote-panic-notification-loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-panic-notification-loopback.mjs
      - name: Test remote-panic-levels-loopback
        shell: pwsh
        run: |
          $output = & node --import ./test/harness/register.mjs tests/audit-fixes/remote-panic-levels-loopback.mjs 2>&1 | Out-String
          $result = $LASTEXITCODE
          Write-Output $output
          if ($result -ne 0) {
            $detail = $output -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            if ($detail.Length -gt 10000) { $detail = $detail.Substring($detail.Length - 10000) }
            Write-Output "::error title=Remote panic levels test::$detail"
            exit $result
          }
      - name: Test remote-panic-p1-failure-loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-panic-p1-failure-loopback.mjs
      - name: Test remote-panic-pwa-loopback
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'remote-panic-pwa-loopback.log'
          cmd /c "node --import ./test/harness/register.mjs tests/audit-fixes/remote-panic-pwa-loopback.mjs > `"$log`" 2>&1"
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($code -ne 0) {
            $text = Get-Content -LiteralPath $log -Raw
            if ($text.Length -gt 12000) { $text = $text.Substring($text.Length - 12000) }
            $text = $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Remote panic PWA test::$text"
            exit $code
          }
      - name: Test remote-panic-local-recovery-loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-panic-local-recovery-loopback.mjs
      - name: Test remote-panic-preserve-local-loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-panic-preserve-local-loopback.mjs
      - name: Test remote-panel-expiry-gate-loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-panel-expiry-gate-loopback.mjs
      - name: Test remote-snapshot-rejection-loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-snapshot-rejection-loopback.mjs
      - name: Test supervisor snapshot restore detection on isolated SQLite
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'remote-supervisor-test.log'
          cmd /c "node --import ./test/harness/register.mjs tests/audit-fixes/remote-hub-supervisor.mjs > `"$log`" 2>&1"
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($code -ne 0) {
            $text = Get-Content -LiteralPath $log -Raw
            if ($text.Length -gt 12000) { $text = $text.Substring($text.Length - 12000) }
            $text = $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Remote supervisor test::$text"
            exit $code
          }
      - name: Test audit sync epoch race checks with isolated state files
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-audit-state-races.mjs
      - name: Test isolated cloud state lock ownership
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-cloud-state.mjs
      - name: Test experimental transport vault with a simulated protector
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-transport-vault.mjs
      - name: Test experimental command issuer using isolated SQLite
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-command-issuer.mjs
      - name: Test experimental cross-process mobile approval and revocation
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-cross-process-approval-loopback.mjs
      - name: Test experimental approval fence race
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-approval-fence-race.mjs
      - name: Test approval restore marker fence over loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-approval-restore-marker-loopback.mjs
      - name: Test approval database replacement fence over loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-approval-database-replacement-loopback.mjs
      - name: Test startup database replacement fence over loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-startup-database-fence-loopback.mjs
      - name: Test restore beginning during startup over loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-startup-barrier-race-loopback.mjs
      - name: Test experimental approval bridge failure and replay
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-approval-bridge-security.mjs
      - name: Test experimental durable grant replay ledger
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-grant-replay-ledger.mjs
      - name: Test supervisor grant replay after state reopen
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-supervisor-grant-replay-loopback.mjs
      - name: Test approval admission latch over loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-approval-admission-latch-loopback.mjs
      - name: Test mobile approval and panic across hub restart
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-mobile-approval-panic-restart-loopback.mjs
      - name: Test child-clock snapshot freshness
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-snapshot-child-clock-loopback.mjs
      - name: Test restore admission drain over loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-restore-admission-drain-loopback.mjs
      - name: Test restore epoch fence over loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-restore-epoch-fence-loopback.mjs
      - name: Test backup coordination lifecycle
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-backup-coordination-lifecycle.mjs
      - name: Test backup IPC security fence
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-backup-ipc-fence-loopback.mjs
      - name: Test real replacement through backup IPC
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-backup-real-replace-ipc-loopback.mjs
      - name: Test backup drains approval identity checks
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'remote-backup-approval-drain.log'
          cmd /c "node --import ./test/harness/register.mjs tests/audit-fixes/remote-backup-approval-drain-loopback.mjs > `"$log`" 2>&1"
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($code -ne 0) {
            $text = Get-Content -LiteralPath $log -Raw
            if ($text.Length -gt 12000) { $text = $text.Substring($text.Length - 12000) }
            $text = $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Remote backup approval drain test::$text"
            exit $code
          }
