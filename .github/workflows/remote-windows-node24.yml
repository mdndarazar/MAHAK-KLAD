        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-backup-claim-drain-loopback.mjs
      - name: Test real merge through backup IPC
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-backup-real-merge-ipc-loopback.mjs
      - name: Test direct merge fence
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-backup-direct-merge-loopback.mjs
