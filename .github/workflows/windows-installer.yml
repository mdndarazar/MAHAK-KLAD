name: Build Windows installer

on:
  # PRs (including drafts) may build/test an installer artifact. They may NOT
  # publish a release or touch a customer database.
  pull_request:
    branches: [main]
  push:
    branches:
      - arena/074a2e5d-newmahak
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish ONLY after the on-site upgrade/installer/printer gates are signed off
        required: false
        default: false
        type: boolean
      release_tag:
        description: Immutable release tag to create when publishing
        required: false
        default: ''
        type: string
      production_verified:
        description: BackupService copy, real Windows installer and printer checks were approved
        required: false
        default: false
        type: boolean
      onsite_evidence_ref:
        description: Reference to the signed on-site cutover checklist (no customer data)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  package-windows:
    name: Verify and package MahakPOS for Windows
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and generate the real Prisma client
        run: |
          npm ci
          npm run db:generate

      - name: Verify types, syntax and financial receipt migrations on Windows
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:syntax
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = @(
            'tests/audit-fixes/fix-financial-real-migration-upgrade.mjs',
            'tests/audit-fixes/fix-financial-receipt-source-upgrade.mjs',
            'tests/audit-fixes/fix-financial-goods-warehouse.mjs',
            'tests/audit-fixes/fix-financial-goods-multi-source-correction.mjs',
            'tests/audit-fixes/fix-financial-goods-source-edge-cases.mjs',
            'tests/audit-fixes/fix-financial-goods-all-methods.mjs',
            'tests/audit-fixes/fix-financial-corrected-return-cap.mjs',
            'tests/audit-fixes/fix-financial-credit-funded-exchange-scenario.mjs',
            'tests/audit-fixes/fix-s222-print-phase6-remaining-prints.mjs',
            'tests/audit-fixes/fix-s372-exchange-print-panel-gate.mjs'
          )
          foreach ($test in $tests) {
            node --import ./test/harness/register.mjs $test
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $test" }
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run dist:win -- --publish never *>&1 | Tee-Object -FilePath build-output.log
          if ($LASTEXITCODE -ne 0) {
            $lastLines = (Get-Content build-output.log -Tail 20) -join " | "
            Write-Output "::error title=Installer build failed::$lastLines"
            exit $LASTEXITCODE
          }

      - name: Create installable and source ZIPs
        if: success()
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          Compress-Archive -Path $installer.FullName -DestinationPath "dist/MahakPOS-$env:GITHUB_SHA-win-x64-installer.zip" -Force
          git archive --format=zip --prefix=MahakPOS/ $env:GITHUB_SHA --output "dist/MahakPOS-$env:GITHUB_SHA-source.zip"
          $releaseFiles = Get-ChildItem -Path dist -File | Where-Object { $_.Name -match '\.exe$|-installer\.zip$|-source\.zip$' }
          $lines = $releaseFiles | ForEach-Object { "$( (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower() )  $($_.Name)" }
          Set-Content -Path 'dist/SHA256SUMS.txt' -Value $lines -NoNewline

      - name: Upload Windows installer (artifact only; not a release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MahakPOS-Windows-installer
          path: |
            dist/*.exe
            dist/*-installer.zip
            dist/*-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MahakPOS-Windows-build-log
          path: build-output.log
          if-no-files-found: warn
          retention-days: 30

  publish-release:
    # A PR/push can never publish. A human must dispatch on main, affirm the
    # on-site gates and supply a traceable evidence reference. No default tag
    # or commit-message shortcut can publish version 400 by accident.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          inputs.create_release && inputs.production_verified &&
          inputs.release_tag != '' && inputs.onsite_evidence_ref != '' }}
    needs: package-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download the tested installer artifact
        uses: actions/download-artifact@v4
        with:
          name: MahakPOS-Windows-installer
          path: dist
      - name: Publish approved release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ONSITE_EVIDENCE_REF: ${{ inputs.onsite_evidence_ref }}
        run: |
          $files = Get-ChildItem -Path dist -File | Where-Object { $_.Name -match '\.exe$|-installer\.zip$|-source\.zip$|^SHA256SUMS\.txt$' }
          if (-not ($files | Where-Object { $_.Name -match '\.exe$' })) { throw 'No installer to publish.' }
          $assets = @($files | ForEach-Object { $_.FullName })
          gh release create "$env:RELEASE_TAG" @assets --target "$env:GITHUB_SHA" --title "MahakPOS $env:RELEASE_TAG" --notes "Windows x64 installer built from $env:GITHUB_SHA. On-site sign-off reference: $env:ONSITE_EVIDENCE_REF."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
