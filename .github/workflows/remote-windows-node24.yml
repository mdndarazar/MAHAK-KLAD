name: Remote hub Windows Node 24 compatibility

on:
  push:
    branches:
      - arena/e478473a-mahak-klad
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-node24:
    name: Windows Node 24 compatibility (experimental)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out current commit
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test isolated hub on temporary SQLite
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-windows-node24.mjs
      - name: Test experimental command issuer using isolated SQLite
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-command-issuer.mjs
      - name: Test read-only invoice facts using isolated SQLite
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-invoice-facts-readonly.mjs
      - name: Test experimental mobile invoice API using isolated SQLite
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-mobile-invoices-http.mjs
      - name: Test experimental cross-process invoice reads using isolated SQLite
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-hub-invoices-ipc.mjs
      - name: Test simulated multiple HTTPS origins on loopback
        run: node --import ./test/harness/register.mjs tests/audit-fixes/remote-multiple-origins.mjs
      - name: Test mobile invoice capability and UI scripts
        shell: pwsh
        run: |
          node --import ./test/harness/register.mjs tests/audit-fixes/remote-mobile-invoices-capabilities.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --import ./test/harness/register.mjs tests/audit-fixes/remote-mobile-invoices-ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test CMD scripts with mocked npm and isolated files
        shell: pwsh
        run: |
          $output = & node tests/audit-fixes/windows-cmd-scripts.mjs 2>&1 | Out-String
          $result = $LASTEXITCODE
          Write-Output $output
          if ($result -ne 0) {
            $detail = $output -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            if ($detail.Length -gt 10000) { $detail = $detail.Substring(0,10000) }
            Write-Output "::error title=Windows CMD test details::$detail"
            exit $result
          }
          node tests/audit-fixes/windows-cmd-env-guards.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify disabled remote and existing password behavior
        shell: pwsh
        run: |
          node --import ./test/harness/register.mjs tests/audit-fixes/remote-disabled-by-default.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --import ./test/harness/register.mjs tests/audit-fixes/remote-gt-password-collision.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build application sources
        run: npm run build
      - name: Typecheck application
        run: npm run typecheck
